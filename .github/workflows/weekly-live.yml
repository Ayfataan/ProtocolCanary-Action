name: Weekly live integration (Protocol 29)

# Exercises the real three-repository pipeline end to end: this Action,
# the real Protocol-Canary CLI (built from source via `cargo install`),
# the real StellarCanary/ProtocolCanary-Fixtures pack, and LIVE Protocol 29
# test-network RPC endpoints. Renamed from `integration.yml` (same weekly
# schedule) and repaired for Protocol 29 (#352): the old file still targeted
# Protocol 28 after Testnet/Futurenet moved to protocol 29, so the weekly run
# failed against the updated networks.
#
# This is intentionally separate from ci.yml: Testnet/Futurenet availability
# must never be a prerequisite for the ordinary unit-test workflow that gates
# pull requests, so this runs only on the weekly schedule and on manual
# dispatch.
#
# Network configuration (the current Protocol 29 test networks):
#   testnet  — passphrase "Test SDF Network ; September 2015",
#              RPC https://soroban-testnet.stellar.org
#   futurenet — passphrase "Test SDF Future Network ; October 2022",
#              RPC https://rpc-futurenet.stellar.org
# The Action selects the network (and therefore the matching passphrase)
# with `network:`; `rpc-url:` pins the Protocol 29 endpoint explicitly. The
# passphrase is repeated in `env`/`NETWORK_PASSPHRASE` below so every job
# log records exactly which network the canary ran against.
#
# A failed scheduled run also opens or updates a SINGLE tracking issue
# labelled `weekly-live` (#420) so the failure has an owner and a timeline
# instead of only a line in the Actions tab: the `track-failure` job
# creates the issue on the first failure, comments on it while it stays
# open, and comments on and closes it when a run goes fully green. The
# `weekly-live` label must exist in the repository (see CONTRIBUTING.md,
# "Tracking weekly live failures"); `gh issue create` fails loudly if it
# does not.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

# The default token is read-only; the `track-failure` job widens its own
# scope to `issues: write` (job-level), and no other job gains any write
# permission. Keeping this here means every job is read-only unless it
# explicitly opts in.
permissions:
  contents: read

env:
  TARGET_PROTOCOL: "29"
  # The label that identifies the single open tracking issue (#420).
  TRACKING_LABEL: weekly-live

jobs:
  live-check:
    name: Live canary (Protocol 29 ${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs must run even when one network is down, so a Testnet outage
      # still tells us whether Futurenet is healthy (and vice versa).
      fail-fast: false
      matrix:
        include:
          - network: testnet
            rpc-url: https://soroban-testnet.stellar.org
            passphrase: "Test SDF Network ; September 2015"
          - network: futurenet
            rpc-url: https://rpc-futurenet.stellar.org
            passphrase: "Test SDF Future Network ; October 2022"
    env:
      NETWORK_NAME: ${{ matrix.network }}
      NETWORK_RPC_URL: ${{ matrix.rpc-url }}
      NETWORK_PASSPHRASE: ${{ matrix.passphrase }}
    steps:
      - name: Checkout this Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout ProtocolCanary-Fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          path: fixtures

      - name: Run Stellar Protocol Canary (this Action, from source)
        id: run
        uses: ./
        with:
          protocol: "29"
          # Newest published pack; the Protocol 29 pack replaces this path as
          # soon as ProtocolCanary-Fixtures ships it.
          fixtures-dir: fixtures/protocol-28
          network: ${{ matrix.network }}
          rpc-url: ${{ matrix.rpc-url }}

      - name: Record the network configuration
        if: always()
        run: |
          {
            echo "### Protocol 29 ${{ matrix.network }}"
            echo ""
            echo "- Network passphrase: \`${{ matrix.passphrase }}\`"
            echo "- RPC endpoint: ${{ matrix.rpc-url }}"
            echo "- Target protocol: ${{ env.TARGET_PROTOCOL }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # An unreachable endpoint must fail safely with a clear diagnostic, not
      # silently pass: surface the failure as an annotation plus a summary
      # note alongside the Action's own execution-failure summary (#352).
      - name: Notify on failure
        if: failure()
        run: |
          {
            echo "### ❌ Weekly live canary failed (Protocol 29 ${{ matrix.network }})"
            echo ""
            echo "- Endpoint: ${{ matrix.rpc-url }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "If the remote RPC endpoint is unreachable, the step summary above"
            echo "carries the engine's diagnostic; the workflow fails safely instead"
            echo "of reporting a compatibility result."
          } >> "$GITHUB_STEP_SUMMARY"
      # Record this leg's outcome in the summary so the tracking job (which
      # treats a non-success `live-check` result as "at least one leg
      # failed") and a human reading the run can both see which leg it was.
      - name: Record this leg's outcome
        if: always()
        shell: bash
        env:
          LEG_NETWORK: ${{ matrix.network }}
          LEG_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [ "${LEG_OUTCOME:-}" = "success" ]; then
            mark="✅ passed"
          else
            mark="❌ failed (${LEG_OUTCOME:-no outcome})"
          fi
          {
            echo ""
            echo "- \`${LEG_NETWORK}\`: ${mark}"
          } >> "$GITHUB_STEP_SUMMARY"

  # One tracking issue for the weekly check (#420): a single failure that
  # repeats every Monday should not open a new issue each week. This job
  # runs once, after every matrix leg, and:
  #   * on failure — creates the `weekly-live` issue if none is open, else
  #     comments on the existing one;
  #   * on a fully green run — comments on and closes the open issue.
  # It is the only job with a write scope (`issues: write`); the workflow
  # default stays read-only.
  track-failure:
    name: Track weekly live failure
    needs: live-check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open, update, or close the tracking issue
        shell: bash
        env:
          RUN_OUTCOME: ${{ needs.live-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="${TRACKING_LABEL:?TRACKING_LABEL must name the tracking label}"

          # The `gh` CLI refuses to create an issue with an unknown label and
          # exits non-zero, so a missing label fails this job loudly instead
          # of silently skipping the notification.
          if ! gh label list --json name --jq '.[].name' | grep -Fxq "$label"; then
            echo "::error::the '$label' label does not exist; create it so the weekly-live tracking issue can be opened (see CONTRIBUTING.md)"
            exit 1
          fi

          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "${RUN_OUTCOME}" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "The weekly live canary is green again. Run: ${RUN_URL}$(printf '\n\n')Closing this tracking issue; it is reopened automatically should the canary fail again."
              gh issue close "$issue" --reason completed
              echo "Weekly live canary passed; closed tracking issue #${issue}"
            else
              echo "Weekly live canary passed and no tracking issue is open; nothing to do."
            fi
            exit 0
          fi

          # A run that did not succeed.
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "The weekly live canary is still failing. Run: ${RUN_URL}"
            echo "Commented on existing tracking issue #${issue}"
          else
            gh issue create \
              --title "Weekly live canary is failing (Protocol 29)" \
              --label "$label" \
              --body "The scheduled weekly live canary has failed. Run: ${RUN_URL}"
            echo "Created a new tracking issue for the weekly live failure"
          fi

      - name: Record the notification outcome
        if: always()
        shell: bash
        env:
          RUN_OUTCOME: ${{ needs.live-check.result }}
        run: |
          {
            echo ""
            echo "### Weekly live tracking issue"
            echo ""
            echo "- Live-check result: \`${RUN_OUTCOME}\`"
            echo "- The \`${TRACKING_LABEL}\` issue was opened, updated, or closed above; see this job's log."
          } >> "$GITHUB_STEP_SUMMARY"