name: Rebuild receipt bundle

on:
  push:
    branches:
      - docs/493-receipt-path-note
    paths:
      - .github/workflows/rebuild-receipt-bundle.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/493-receipt-path-note
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run build
      - name: Verify generated bundle
        run: npm test -- tests/unit/bundle-guard.test.ts
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "Bundle already matches committed output."
          else
            git commit -m "build: regenerate dist for unique receipt paths (#493)"
            git push origin HEAD:docs/493-receipt-path-note
          fi
